<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 520" role="img"><title>Supper Club database relationships</title><desc>Users and restaurants each have many orders. Restaurants have many menu items. Orders and menu items each have many order items.</desc><style>.head{font: bold 19px Georgia;fill:#963c29}.field{font:12px monospace;fill:#24291f}.link{fill:none;stroke:#4e6859;stroke-width:2}.lab{font:14px sans-serif;fill:#35503d}</style><rect width="890" height="520" fill="#f5f1e6"/><text x="28" y="43" font-family="Georgia" font-size="29" font-weight="bold">Supper Club / Data model</text>
<path class="link" d="M238 137H308 M238 353H308 M238 393H267V209H308 M544 150H582V207H627 M544 379H590V299H627"/>
<g transform="translate(28 85)"><rect width="210" height="150" rx="11" fill="#fffdf7" stroke="#c7c3b6"/><path d="M1 38H209" stroke="#c7c3b6"/><text x="13" y="25" class="head">users</text><text x="13" y="60" class="field" xml:space="preserve">PK   id</text><text x="13" y="80" class="field" xml:space="preserve">     name, email¹</text><text x="13" y="100" class="field" xml:space="preserve">     student_code¹</text><text x="13" y="120" class="field" xml:space="preserve">     password_hash</text><text x="13" y="140" class="field" xml:space="preserve">     role</text></g><g transform="translate(28 319)"><rect width="210" height="130" rx="11" fill="#fffdf7" stroke="#c7c3b6"/><path d="M1 38H209" stroke="#c7c3b6"/><text x="13" y="25" class="head">restaurants</text><text x="13" y="60" class="field" xml:space="preserve">PK   id</text><text x="13" y="80" class="field" xml:space="preserve">     name, cuisine, area</text><text x="13" y="100" class="field" xml:space="preserve">     rating, minutes</text><text x="13" y="120" class="field" xml:space="preserve">     art, tagline</text></g><g transform="translate(308 85)"><rect width="236" height="150" rx="11" fill="#fffdf7" stroke="#c7c3b6"/><path d="M1 38H235" stroke="#c7c3b6"/><text x="13" y="25" class="head">orders</text><text x="13" y="60" class="field" xml:space="preserve">PK   id</text><text x="13" y="80" class="field" xml:space="preserve">FK   user_id</text><text x="13" y="100" class="field" xml:space="preserve">FK   restaurant_id (nullable)</text><text x="13" y="120" class="field" xml:space="preserve">     restaurant_name</text><text x="13" y="140" class="field" xml:space="preserve">     total, created_at</text></g><g transform="translate(308 319)"><rect width="236" height="130" rx="11" fill="#fffdf7" stroke="#c7c3b6"/><path d="M1 38H235" stroke="#c7c3b6"/><text x="13" y="25" class="head">menu_items</text><text x="13" y="60" class="field" xml:space="preserve">PK   id</text><text x="13" y="80" class="field" xml:space="preserve">FK   restaurant_id</text><text x="13" y="100" class="field" xml:space="preserve">     name, description</text><text x="13" y="120" class="field" xml:space="preserve">     price, veg, available</text></g><g transform="translate(627 177)"><rect width="228" height="150" rx="11" fill="#fffdf7" stroke="#c7c3b6"/><path d="M1 38H227" stroke="#c7c3b6"/><text x="13" y="25" class="head">order_items</text><text x="13" y="60" class="field" xml:space="preserve">PK   id</text><text x="13" y="80" class="field" xml:space="preserve">FK   order_id</text><text x="13" y="100" class="field" xml:space="preserve">FK   menu_item_id (nullable)</text><text x="13" y="120" class="field" xml:space="preserve">     item_name</text><text x="13" y="140" class="field" xml:space="preserve">     price, qty</text></g><g class="lab"><text x="244" y="131">1</text><text x="288" y="131">N</text><text x="244" y="347">1</text><text x="288" y="347">N</text><text x="244" y="389">1</text><text x="288" y="204">N</text><text x="550" y="144">1</text><text x="609" y="201">N</text><text x="550" y="373">1</text><text x="609" y="293">N</text></g><text x="28" y="492" font-family="sans-serif" font-size="13">1 → N = one parent to many children    ·    PK = primary key    ·    FK = foreign key    ·    ¹ unique</text></svg>
